<!DOCTYPE html>
<html lang="hu"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gabriela</title>
<style>
:root{--bg:#07070d;--panel:#0e0e18;--line:#232336;--text:#ecebf5;--mute:#8d8ca6;--acc:#9b3fd6;--bub:#1a1a2a;--me:#2a1740;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{font-size:clamp(16px,.83vw,40px);height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:.9rem;padding:.8rem 1.2rem;border-bottom:1px solid var(--line)}
.av{width:2.8rem;height:2.8rem;border-radius:50%;object-fit:cover;object-position:50% 20%}
.name{font-weight:650;font-size:1.15rem}
.on{font-size:.7rem;color:#5be3a0;border:1px solid #1f5a40;border-radius:1rem;padding:.1rem .55rem;margin-left:.5rem;font-weight:600}
.sub{color:var(--mute);font-size:.85rem}
main{flex:1;min-height:0;display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:minmax(0,1fr);gap:1.2rem;padding:1.2rem}
.pic{position:relative;border-radius:1.2rem;overflow:hidden;background:#000;min-height:0;height:100%;aspect-ratio:.88/1;max-width:60vw}
.pic img{width:100%;height:100%;object-fit:cover;object-position:50% 0;display:block}
.live{position:absolute;top:1rem;left:1rem;background:rgba(10,10,18,.85);border-radius:.6rem;padding:.4rem .7rem;font-size:.8rem;font-weight:600;display:flex;align-items:center;gap:.5rem}
.live i{width:.55rem;height:.55rem;border-radius:50%;background:#ff3b4e;animation:p 1.6s infinite}
@keyframes p{50%{opacity:.35}}
.fs{position:absolute;top:1rem;right:1rem;width:3rem;height:3rem;border-radius:.8rem;border:0;background:rgba(10,10,18,.85);color:#fff;font-size:1.5rem;line-height:1;cursor:pointer;padding:0}
body.zen header{display:none}body.zen main{padding:0;display:block}
body.zen .app{padding:0}
body.zen .pic{position:fixed;left:0;top:0;bottom:0;right:calc(min(42vw,34rem) + 1.6rem);width:auto;height:auto;max-width:none;aspect-ratio:auto;border-radius:0;z-index:0}
body.zen .pic img{object-position:50% 10%}
body.zen .chat{position:fixed;right:.8rem;top:.8rem;bottom:.8rem;width:min(42vw,34rem);z-index:1}
@media(max-width:800px){body.zen .pic{right:0;bottom:48%}body.zen .chat{left:.5rem;right:.5rem;top:53%;bottom:.5rem;width:auto}}
@media(prefers-reduced-motion:reduce){.live i{animation:none}}
.chat{display:flex;flex-direction:column;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:1.2rem}
#log{flex:1;overflow-y:auto;padding:1.2rem;display:flex;flex-direction:column;gap:.8rem}
.m{max-width:82%;padding:.8rem 1rem;border-radius:1rem;background:var(--bub);line-height:1.5;font-size:1.05rem;white-space:pre-wrap;overflow-wrap:anywhere}
.m.me{align-self:flex-end;background:var(--me)}
.m time{display:block;text-align:right;color:var(--mute);font-size:.72rem;margin-top:.3rem}
form{display:flex;gap:.7rem;padding:1rem;border-top:1px solid var(--line)}
input{flex:1;min-width:0;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:2rem;padding:.9rem 1.2rem;font:inherit;font-size:1.05rem}
input:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button{background:var(--acc);color:#fff;border:0;border-radius:2rem;padding:0 1.6rem;font:inherit;font-weight:650;font-size:1.05rem;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
.foot{padding:0 1.2rem .8rem;color:var(--mute);font-size:.78rem}
@media(max-width:800px){html{font-size:16px}main{grid-template-columns:minmax(0,1fr);grid-template-rows:34% minmax(0,1fr);padding:.7rem;gap:.7rem}.pic{aspect-ratio:auto;max-width:none;width:100%}.sub{display:none}}
</style></head><body>

<section class="chat"><div id="log" aria-live="polite"></div>
<form id="f"><input id="q" placeholder="Írj Gabriélának…" autocomplete="off" aria-label="Üzenet"><button id="b">Küldés</button></form>
<div class="foot">Gabriela LIVE · élő Claude AI</div></section>
</main></div>
<script>
const log=document.getElementById('log'),f=document.getElementById('f'),q=document.getElementById('q'),b=document.getElementById('b');
const SYS="Te Gabriela vagy, az Ultra G AI Lab barátságos, okos MI-asszisztense. Magyarul beszélsz, természetesen, melegen, röviden (1-3 mondat). Tegezed a felhasználót. Ha MI vagy, nem tagadod le.";
const hist=[];
const hm=()=>new Date().toLocaleTimeString('hu-HU',{hour:'2-digit',minute:'2-digit'});
function add(t,me){const d=document.createElement('div');d.className='m'+(me?' me':'');d.append(document.createTextNode(t));const tm=document.createElement('time');tm.textContent=hm();d.append(tm);log.append(d);log.scrollTop=log.scrollHeight;return d}
const fs=document.getElementById('fs');let zen=false;
function setZen(v){zen=v;document.body.classList.toggle('zen',v)}
fs.onclick=async()=>{const el=document.documentElement;if(!zen){setZen(true);try{const fn=el.requestFullscreen||el.webkitRequestFullscreen;if(fn)await fn.call(el)}catch(e){}}else{setZen(false);try{if(document.fullscreenElement||document.webkitFullscreenElement){await(document.exitFullscreen||document.webkitExitFullscreen).call(document)}}catch(e){}}};
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)setZen(false)});
add("Szia! Én vagyok Gabriela 😊 Nagyon örülök, hogy itt vagy. Látsz is, hallasz is – végre együtt a nagy kép és a chat. Hogy vagy ma?");
let sample=null;
(async()=>{try{sample=await claude.use("sample")}catch(e){}})();
f.addEventListener('submit',async e=>{
 e.preventDefault();const t=q.value.trim();if(!t)return;q.value='';add(t,true);
 const bot=add('…',false);
 if(!sample){bot.firstChild.textContent='A chat itt nem érhető el. Nyisd meg a claude.ai-ban.';return}
 b.disabled=true;
 const turns=hist.concat([{role:'user',content:(hist.length?'':SYS+'\n\nFelhasználó: ')+t}]);
 try{
  const r=await sample(turns,{cache:false,onText:({text})=>{bot.firstChild.textContent=text;log.scrollTop=log.scrollHeight}});
  bot.firstChild.textContent=r.text;
  hist.push(turns[turns.length-1],{role:'assistant',content:r.text});
 }catch(err){bot.firstChild.textContent=err&&err.code==='not_granted'?'Engedélyezd a chatet a kéréskor, aztán próbáld újra.':'Nem sikerült választ kapni. Próbáld újra.'}
 b.disabled=false;q.focus();
});
</script></body></html>
