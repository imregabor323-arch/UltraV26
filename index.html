<script>
// Élő univerzum: több mélységű csillagmező + köd + meteorok
const c=document.getElementById('uni'); const ctx=c.getContext('2d'); let W=0,H=0,D=1;
function rs(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;c.style.width=W+'px';c.style.height=H+'px';ctx.setTransform(D,0,0,D,0,0);}
rs(); addEventListener('resize',rs);
const stars=Array.from({length:420},()=>({x:Math.random(),y:Math.random(),z:.15+Math.random()*.85,r:.35+Math.random()*1.65,a:.25+Math.random()*.75,p:Math.random()*6.28,s:.15+Math.random()*.65}));
const dust=Array.from({length:55},()=>({x:Math.random(),y:Math.random(),r:20+Math.random()*100,a:.012+Math.random()*.025,v:(Math.random()-.5)*.00012}));
let meteors=[]; let nextMeteor=Date.now()+1800;
function spawnMeteor(){meteors.push({x:Math.random()*W*1.15-W*.05,y:Math.random()*H*.35-H*.1,len:60+Math.random()*130,v:5+Math.random()*8,a:.7+Math.random()*.3});}
function drawUniverse(t){
  ctx.clearRect(0,0,W,H);
  const g=ctx.createRadialGradient(W*.5,H*.48,0,W*.5,H*.48,Math.max(W,H)*.72);g.addColorStop(0,'rgba(85,90,190,.10)');g.addColorStop(.45,'rgba(30,50,120,.035)');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  dust.forEach(d=>{d.x+=d.v;if(d.x>1)d.x=0;if(d.x<0)d.x=1;ctx.beginPath();ctx.arc(d.x*W,d.y*H,d.r,0,Math.PI*2);ctx.fillStyle=\`rgba(100,120,210,\${d.a})\`;ctx.fill();});
  stars.forEach(s=>{const tw=.72+.28*Math.sin(t*.001*s.s+s.p);const size=s.r*(.55+.75*s.z);ctx.globalAlpha=s.a*tw;ctx.beginPath();ctx.arc(s.x*W,s.y*H,size,0,Math.PI*2);ctx.fillStyle=s.z>.7?'#fff':'#c7d2fe';ctx.fill();if(s.z>.86){ctx.globalAlpha*=.22;ctx.fillRect(s.x*W-size*3,s.y*H-.35,size*6,.7);ctx.fillRect(s.x*W-.35,s.y*H-size*3,.7,size*6);}});
  ctx.globalAlpha=1;
  if(Date.now()>nextMeteor){spawnMeteor();nextMeteor=Date.now()+2500+Math.random()*5000;}
  meteors=meteors.filter(m=>m.x<W+200&&m.y<H+200);meteors.forEach(m=>{m.x+=m.v;m.y+=m.v*.55;const gr=ctx.createLinearGradient(m.x,m.y,m.x-m.len,m.y-m.len*.55);gr.addColorStop(0,\`rgba(255,255,255,\${m.a})\`);gr.addColorStop(1,'rgba(150,170,255,0)');ctx.strokeStyle=gr;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(m.x,m.y);ctx.lineTo(m.x-m.len,m.y-m.len*.55);ctx.stroke();});
  requestAnimationFrame(drawUniverse);
}
requestAnimationFrame(drawUniverse);

function insertAtCursor(html){
  try{
    const sel=window.getSelection();
    if(sel && sel.rangeCount){
      const range=sel.getRangeAt(0); range.deleteContents();
      const frag=range.createContextualFragment(html); range.insertNode(frag);
      range.collapse(false); sel.removeAllRanges(); sel.addRange(range);
    } else { document.execCommand('insertHTML', false, html); }
  }catch(e){ document.execCommand('insertHTML', false, html); }
}
function compressImage(file, maxSize=900, quality=0.68){
  return new Promise((res, rej)=>{
    const r=new FileReader();
    r.onload=ev=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width, h=img.height;
        if(w>maxSize||h>maxSize){ if(w>h){ h=Math.round(h*maxSize/w); w=maxSize; } else { w=Math.round(w*maxSize/h); h=maxSize; } }
        const canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
        const ctx=canvas.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h);
        ctx.drawImage(img,0,0,w,h);
        try{ res(canvas.toDataURL('image/jpeg', quality)); }catch{ res(ev.target.result); }
      };
      img.onerror=()=>res(ev.target.result);
      img.src=ev.target.result;
    };
    r.onerror=()=>rej();
    r.readAsDataURL(file);
  });
}
function imageGridHtml(htmlBatch){

}
function addTinyImage(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*,image/heic,image/heif'; inp.multiple=true; inp.style.display='none';
  document.body.appendChild(inp);

    const raw=Array.from(e.target.files||[]);
    const files=raw.filter(f=> f.type.startsWith('image/') || f.name.toLowerCase().endsWith('.heic') || f.name.toLowerCase().endsWith('.heif') );
    if(!files.length){ document.body.removeChild(inp); return; }
    let htmlBatch='';

      try{
        const dataUrl=await compressImage(f,900,0.68);
        const id='img_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);
        htmlBatch+=\`<img id="\${id}" src="\${dataUrl}" class="mini-img" data-full="0" title="Katt: nagyítás">\`;
      }catch(err){ console.error(err); }
    }

    document.body.removeChild(inp);
  };
  inp.click();
}

function deleteRubrika(id){
  const el=document.getElementById(id);
  if(!el) return;
  // mentes undo-hoz
  deletedStack.push({id:id, html:el.outerHTML, parent:el.parentNode});
  if(deletedStack.length>10) deletedStack.shift();
  el.style.transition='.2s'; el.style.transform='scale(0) rotate(5deg)'; el.style.opacity='0';
  setTimeout(()=>{ el.remove(); saveNoteAuto && saveNoteAuto(); },200);
}

  const el=document.getElementById(id);
  if(el) el.classList.add('selected');
  window.selectedRubrikaId=id;
}

  else alert('Előbb kattints egy rubrikára hogy kijelöld (sárga keret), aztán törlés!');

function deleteLastInserted(){
  if(lastInsertedIds.length===0){ alert('Nincs mit törölni - még nem szúrtál be rubrikát'); return; }
  const lastId=lastInsertedIds.pop();
  const el=document.getElementById(lastId);
  if(el){ deleteRubrika(lastId); } else {
    // ha már nincs meg, próbáld az utolsó elemet a jegyzetben
    const boxes=document.querySelectorAll('.rubrika-box');
    if(boxes.length>0){ deleteRubrika(boxes[boxes.length-1].id); }
  }
}

function undoDelete(){
  if(deletedStack.length===0){ alert('Nincs mit visszahozni'); return; }
  const last=deletedStack.pop();
  const ed=document.getElementById('editor');
  ed.insertAdjacentHTML('beforeend', last.html);
  saveNoteAuto && saveNoteAuto();
}

// FONTOS: gépelés közben csak akkor alakítunk át egy hivatkozást,

let bibleDetectTimer=null;
function bibleBookNamePattern(){
  const names=[];
  if(typeof BIBLE_BOOKS!=='undefined' && Array.isArray(BIBLE_BOOKS)) BIBLE_BOOKS.forEach(b=>{if(b&&b[0])names.push(String(b[0]));});
  if(typeof BIBLE_ALIASES!=='undefined' && BIBLE_ALIASES) Object.keys(BIBLE_ALIASES).forEach(k=>names.push(k));
  const clean=[...new Set(names.map(x=>String(x).trim()).filter(Boolean))];
  clean.sort((a,b)=>b.length-a.length);
  return '(?:'+clean.map(x=>x.replace(/[.*+?^\${}()|[\\]\\\\]/g,'\\\\$&').replace(/\\\\s+/g,'\\\\s+')).join('|')+')';
}
function bibleReferencePattern(finalPass=false){
  const book=bibleBookNamePattern();
  const full=book+'\\\\s+\\\\d+\\\\s*:\\\\s*\\\\d+(?:\\\\s*[-–]\\\\s*\\\\d+)?';
  const live='(?:'+book+'\\\\s+\\\\d+\\\\s*:\\\\s*\\\\d{2,}(?:\\\\s*[-–]\\\\s*\\\\d+)?)|(?:'+book+'\\\\s+\\\\d+\\\\s*:\\\\s*\\\\d+(?:\\\\s*[-–]\\\\s*\\\\d+)?)(?=\\\\s|[.,;:!?)}\\\\]»”"])';
  return new RegExp('('+ (finalPass ? full : live) +')','gi');
}
function getCaretInfo(root){const sel=window.getSelection();if(!sel||!sel.rangeCount||!root.contains(sel.anchorNode))return null;return {node:sel.anchorNode,offset:sel.anchorOffset};}
function replaceRefsInTextNode(node,finalPass=false,caretInfo=null){
  if(!node||node.nodeType!==Node.TEXT_NODE||!node.parentNode)return false;
  if(node.parentElement&&node.parentElement.closest('.bible-ref'))return false;
  const txt=node.nodeValue||'',re=bibleReferencePattern(finalPass);let m,last=0,changed=false,caretAfter=null,caretOffset=0;
  const frag=document.createDocumentFragment();
  while((m=re.exec(txt))){
    const raw=String(m[1]||'').trim();
    if(!raw||typeof parseBibleRef!=='function'||!parseBibleRef(raw))continue;
    const a=m.index,b=m.index+m[1].length;
    if(!finalPass&&caretInfo&&caretInfo.node===node&&b>caretInfo.offset)continue;
    frag.appendChild(document.createTextNode(txt.slice(last,a)));
    const span=document.createElement('span');span.className='bible-ref';span.dataset.ref=raw;span.setAttribute('role','button');span.setAttribute('tabindex','0');span.setAttribute('contenteditable','false');span.title='Kattints a Biblia-vers megnyitásához';span.innerHTML='📖 <span class="bible-ref-text"></span>';span.querySelector('.bible-ref-text').textContent=raw;frag.appendChild(span);
    frag.appendChild(document.createTextNode(''));
    if(caretInfo&&caretInfo.node===node&&caretInfo.offset>=b){caretAfter=span;caretOffset=caretInfo.offset-b;}
    last=b;changed=true;
  }
  if(!changed)return false;
  frag.appendChild(document.createTextNode(txt.slice(last)));const parent=node.parentNode;parent.replaceChild(frag,node);
  if(caretAfter){const target=caretAfter.nextSibling;const sel=window.getSelection(),r=document.createRange();if(target&&target.nodeType===Node.TEXT_NODE)r.setStart(target,Math.min(caretOffset,target.nodeValue.length));else r.setStartAfter(caretAfter);r.collapse(true);sel.removeAllRanges();sel.addRange(r);}
  return true;
}
function safeBibleCheck(finalPass=false){
  if(window.__v26BibleProcessing)return;const ed=document.getElementById('editor');if(!ed)return;window.__v26BibleProcessing=true;
  try{const caret=getCaretInfo(ed);let changed=false;if(caret&&caret.node&&caret.node.nodeType===Node.TEXT_NODE)changed=replaceRefsInTextNode(caret.node,finalPass,caret)||changed;if(finalPass){const w=document.createTreeWalker(ed,NodeFilter.SHOW_TEXT,null,false),nodes=[];let n;while((n=w.nextNode())){if(n.parentElement&&n.parentElement.closest('.bible-ref'))continue;nodes.push(n);}for(const x of nodes)changed=replaceRefsInTextNode(x,true,null)||changed;}if(changed&&typeof saveNoteAuto==='function')saveNoteAuto();}catch(e){console.error('Biblia-hivatkozás hiba:',e);}finally{window.__v26BibleProcessing=false;}
}

function normalizeBibleImport(raw){

    }
    if(x.verses){
      // Passage format: verses -> karoli -> chapter -> verse
      if(x.verses.karoli) walk(x.verses.karoli,ctx);
      else walk(x.verses,ctx);
    }
    if(x.book_id!=null && x.chapter_verse){
      const bn=Number(x.book_id);
      const vv=x.verses?.karoli||x.verses;
      if(vv&&typeof vv==='object'&&Number.isFinite(bn)) Object.entries(vv).forEach(([ch,verses])=>Object.entries(verses||{}).forEach(([vn,v])=>push({book:bn,chapter:ch,verse:vn,text:v?.text??v?.content??v})));
    }
    const direct=bibleVerseRecord(x);if(direct){records.push(direct);return;}
    if(x.books){walk(x.books,ctx);return;}
    if(x.chapters){
      const bn=Number(x.number??x.nr??x.book??x.book_id??x.id);
      if(Number.isFinite(bn)) x.chapters.forEach(ch=>{
        const cn=Number(ch.number??ch.chapter??ch.c??ch.id);
        if(Number.isFinite(cn)&&Array.isArray(ch.verses)) ch.verses.forEach(v=>push({book:bn,chapter:cn,verse:v.number??v.verse??v.v,text:v.text??v.verseText??v.t}));

      return;
    }
    Object.entries(x).forEach(([k,v])=>{
      if(v&&typeof v==='object'){
        const numKey=/^\\d+$/.test(k)?Number(k):null;

    });

async function fetchBookWithProgress(bookNo,onProgress,signal){
  const cached=await idbGet('__BOOK_'+bookNo+'__');
  if(cached){onProgress(1,0,0,true);return cached;}
  const url=\`https://api.getbible.net/v2/karoli/\${bookNo}.json\`;
  let lastErr;
  for(let attempt=1;attempt<=5;attempt++){
    try{
      const r=await fetch(url,{signal,cache:'no-store'});
      if(!r.ok){
        if(r.status===429||r.status===503||r.status===502||r.status===504){
          const wait=Math.min(15000,1000*Math.pow(2,attempt-1));
          await new Promise((res,rej)=>{const t=setTimeout(res,wait);if(signal)signal.addEventListener('abort',()=>{clearTimeout(t);rej(new DOMException('Aborted','AbortError'));},{once:true});});
          throw new Error('HTTP '+r.status+' – újrapróbálás');
        }
        throw new Error('HTTP '+r.status);
      }
      const total=Number(r.headers.get('content-length'))||0;
      if(!r.body){const data=await r.json();onProgress(1,JSON.stringify(data).length,total,false);await idbSet('__BOOK_'+bookNo+'__',data);return data;}
      const reader=r.body.getReader();let received=0;const chunks=[];
      while(true){const part=await reader.read();if(part.done)break;chunks.push(part.value);received+=part.value.byteLength;onProgress(total?received/total:null,received,total,false);}
      const bytes=new Uint8Array(received);let pos=0;for(const c of chunks){bytes.set(c,pos);pos+=c.length;}
      const data=JSON.parse(new TextDecoder('utf-8').decode(bytes));
      if(!data || !Array.isArray(data.chapters))throw new Error('A könyv adata hiányos.');
      await idbSet('__BOOK_'+bookNo+'__',data);
      return data;
    }catch(e){
      if(e&&e.name==='AbortError')throw e;
      lastErr=e;
      if(attempt<5)continue;
    }
  }
  throw lastErr||new Error('Ismeretlen letöltési hiba');
}

function v26SpeakCurrentText(){
  const text=window.currentBibleReferenceText||'';if(!text){setSpeechStatus('⚠️ Nincs felolvasható szöveg.');return false;}
  const ss=window.speechSynthesis;
  if(!ss||typeof window.SpeechSynthesisUtterance==='undefined'){alert('Ezen a böngészőn a hangos Biblia nem érhető el.');return false;}
  try{
    ss.cancel();
    v26SpeechStopped=false;v26SpeechRunId++;const run=v26SpeechRunId;
    v26SpeechQueue=v26SpeechChunks(text);v26SpeechIndex=0;
    if(!v26SpeechQueue.length){setSpeechStatus('⚠️ Nincs felolvasható szöveg.');return false;}
    const playNext=()=>{
      if(run!==v26SpeechRunId||v26SpeechStopped||v26SpeechIndex>=v26SpeechQueue.length)return;
      const u=new SpeechSynthesisUtterance(v26SpeechQueue[v26SpeechIndex++]);
      u.lang='hu-HU';u.rate=.92;u.pitch=1;
      const voice=v26PickHungarianVoice();if(voice)u.voice=voice;
      u.onstart=()=>setSpeechStatus('🔊 '+(voice?voice.name:'Magyar hang')+' • felolvasás');
      u.onend=()=>{if(run===v26SpeechRunId&&!v26SpeechStopped)setTimeout(playNext,40);};

    };
    playNext();
    return true;
  }catch(e){setSpeechStatus('⚠️ Hangindítási hiba: '+(e.message||String(e)));return false;}
}

function getContrastColor(hex){
  // hex to luminance
  if(!hex) return '#e5e7eb';
  hex=hex.replace('#','');
  if(hex.length===3) hex=hex.split('').map(c=>c+c).join('');
  const r=parseInt(hex.substr(0,2),16), g=parseInt(hex.substr(2,2),16), b=parseInt(hex.substr(4,2),16);
  const lum=(0.299*r + 0.587*g + 0.114*b)/255;
  return lum>0.6 ? '#111827' : '#e5e7eb';
}
function colorPage(col){
  const ed=document.getElementById('editor');

  const txtColor=getContrastColor(col);

  if(txtColor==='#111827'){ed.classList.add('light'); ed.classList.remove('dark');}
  else {ed.classList.add('dark'); ed.classList.remove('light');}

  ed.dataset.textColor=txtColor;
}

function loadURL(u){
  if(!u) return;
  let url=u.trim();
  if(!url.startsWith('http')) url='https://'+url;
  document.getElementById('urlInput').value=url;
  const frame=document.getElementById('webFrame');
  const status=document.getElementById('browserStatus');
  // YouTube special handling -> embed
  if(url.includes('youtube.com/watch') || url.includes('youtu.be')){
    let vid='';
    if(url.includes('v=')) vid=url.split('v=')[1].split('&')[0];
    else if(url.includes('youtu.be/')) vid=url.split('youtu.be/')[1].split('?')[0];
    if(vid){
      frame.src='https://www.youtube-nocookie.com/embed/'+vid;
      status.innerHTML='▶️ YouTube betöltve embed módban - működik!';
      return;
    }
  }
  if(url.includes('youtube.com')){
    frame.src=url.replace('youtube.com','youtube-nocookie.com');
    status.innerHTML='▶️ YouTube - ha nem megy, katt: Megnyitás új lapon';
    return;
  }
  // Try iframe
  frame.src=url;
  status.innerHTML='🌐 Betöltés: '+url+'<br>Ha fehér marad (JW.org tiltja iframe-et), használd a "Megnyitás új lapon" gombot - onnan másold vissza!';
  // fallback check
  setTimeout(()=>{
    try{
      if(frame.contentDocument && frame.contentDocument.body && frame.contentDocument.body.innerHTML.length<50){
        status.innerHTML+='<br><b style="color:#fbbf24">⚠️ Ez az oldal tiltja a beágyazást (JW.org, Google). Nyisd új lapon!</b>';
      }
    }catch(e){
      // cross-origin - can't check, assume ok or blocked
    }
  },2000);
}

function calc(){
  const inpEl=document.getElementById('calcInput');
  const inp=inpEl.value.toLowerCase().trim();
  let r='';
  if(!inp){ document.getElementById('calcRes').innerHTML='Írj valamit!'; return; }
  try{
    if(inp.includes('pitagorasz')){
      const n=inp.match(/[\\d.]+/g);
      if(n&&n.length>=2){ const a=parseFloat(n[0]),b=parseFloat(n[1]); r=\`c = √(a²+b²) = \${Math.sqrt(a*a+b*b).toFixed(6)}\`; }
    }else if(inp.includes('fényév')){
      const n=parseFloat(inp)||1; r=\`\${n} fényév = \${(n*9.461e12).toExponential(6)} km = \${(n*63241).toFixed(1)} AU\`;
    }else if(inp.includes('bin')||inp.includes('binary')){
      const num=parseInt(inp); r=\`\${num} dec = \${num.toString(2)} bin = \${num.toString(16).toUpperCase()} hex\`;
    }else{
      // safe eval with math
      let expr=inp.replace(/\\^/g,'**').replace(/sqrt\\(/g,'Math.sqrt(').replace(/cbrt\\(/g,'Math.cbrt(').replace(/cos\\(/g,'Math.cos(').replace(/sin\\(/g,'Math.sin(').replace(/tan\\(/g,'Math.tan(').replace(/log\\(/g,'Math.log10(').replace(/ln\\(/g,'Math.log(').replace(/pi/g,'Math.PI').replace(/e\\b/g,'Math.E');
      // fok -> radian ha cos(30) ertelmezes: ha kis szam, feltetelezzuk fokot
      expr=expr.replace(/Math\\.cos\\((\\d+\\.?\\d*)\\)/g,(m,p)=>\`Math.cos(\${p}*Math.PI/180)\`);
      expr=expr.replace(/Math\\.sin\\((\\d+\\.?\\d*)\\)/g,(m,p)=>\`Math.sin(\${p}*Math.PI/180)\`);
      expr=expr.replace(/Math\\.tan\\((\\d+\\.?\\d*)\\)/g,(m,p)=>\`Math.tan(\${p}*Math.PI/180)\`);
      r=eval(expr);
    }
  }catch(e){ r='Hiba: '+e.message; }
  document.getElementById('calcRes').innerHTML=\`<b style="color:#0f0">▶ \${inp} = \${r}</b>\`;
  window.lastCalcResult=r;
}

function solveQuad(){ const a=parseFloat(document.getElementById('algA').value)||1, b=parseFloat(document.getElementById('algB').value)||0, c=parseFloat(document.getElementById('algC').value)||0; const D=b*b-4*a*c; let res=''; if(D>0){ const x1=(-b+Math.sqrt(D))/(2*a), x2=(-b-Math.sqrt(D))/(2*a); res=\`D=\${D} >0 → x₁=\${x1.toFixed(4)}, x₂=\${x2.toFixed(4)}\`; }else if(D===0){ res=\`D=0 → x=\${(-b/(2*a)).toFixed(4)}\`; }else{ res=\`D=\${D} <0 → komplex: x₁=\${(-b/(2*a)).toFixed(2)}+\${(Math.sqrt(-D)/(2*a)).toFixed(2)}i, x₂=\${(-b/(2*a)).toFixed(2)}-\${(Math.sqrt(-D)/(2*a)).toFixed(2)}i\`; } document.getElementById('algRes').innerHTML=res; document.getElementById('calcInput').value=\`quad \${a},\${b},\${c} → \${res}\`; window.lastCalcResult=res; }
function updateGeo(){ const sel=document.getElementById('geoShape').value; const cont=document.getElementById('geoInputs'); if(sel==='square') cont.innerHTML='a: <input id="ga" type="number" value="5" style="width:60px">'; else if(sel==='rect') cont.innerHTML='a: <input id="ga" type="number" value="5" style="width:60px"> b: <input id="gb" type="number" value="3" style="width:60px">'; else if(sel==='circle') cont.innerHTML='r: <input id="ga" type="number" value="5" style="width:60px">'; else if(sel==='triangle') cont.innerHTML='a: <input id="ga" type="number" value="3" style="width:50px"> b: <input id="gb" type="number" value="4" style="width:50px"> c: <input id="gc" type="number" value="5" style="width:50px">'; else if(sel==='cube') cont.innerHTML='a: <input id="ga" type="number" value="5" style="width:60px">'; else if(sel==='sphere') cont.innerHTML='r: <input id="ga" type="number" value="5" style="width:60px">'; }
function calcGeo(){ const sel=document.getElementById('geoShape').value; let res=''; const a=parseFloat(document.getElementById('ga')?.value)||0, b=parseFloat(document.getElementById('gb')?.value)||0, c=parseFloat(document.getElementById('gc')?.value)||0; if(sel==='square') res=\`Terület=\${a*a}, Kerület=\${4*a}, Átló=\${(a*Math.sqrt(2)).toFixed(3)}\`; else if(sel==='rect') res=\`Terület=\${a*b}, Kerület=\${2*(a+b)}, Átló=\${Math.sqrt(a*a+b*b).toFixed(3)}\`; else if(sel==='circle') res=\`Terület=\${(Math.PI*a*a).toFixed(3)}, Kerület=\${(2*Math.PI*a).toFixed(3)}, Átmérő=\${2*a}\`; else if(sel==='triangle'){ const s=(a+b+c)/2; const area=Math.sqrt(s*(s-a)*(s-b)*(s-c)); res=\`Kerület=\${a+b+c}, Terület=\${area.toFixed(3)} (Heron)\`; } else if(sel==='cube') res=\`Térfogat=\${a*a*a}, Felszín=\${6*a*a}, Testátló=\${(a*Math.sqrt(3)).toFixed(3)}\`; else if(sel==='sphere') res=\`Térfogat=\${((4/3)*Math.PI*a*a*a).toFixed(3)}, Felszín=\${(4*Math.PI*a*a).toFixed(3)}\`; document.getElementById('geoRes').innerHTML=res; window.lastCalcResult=res; }
function calcTrig(type){ const deg=parseFloat(document.getElementById('trigDeg').value)||0; const rad=deg*Math.PI/180; let res=0; if(type==='sin') res=Math.sin(rad); else if(type==='cos') res=Math.cos(rad); else if(type==='tan') res=Math.tan(rad); else if(type==='asin'){ const v=Math.asin(deg)*180/Math.PI; res=\`asin(\${deg})=\${v.toFixed(4)}°\`; document.getElementById('trigRes').innerHTML=res; window.lastCalcResult=res; return; } else if(type==='acos'){ const v=Math.acos(deg)*180/Math.PI; res=\`acos(\${deg})=\${v.toFixed(4)}°\`; document.getElementById('trigRes').innerHTML=res; window.lastCalcResult=res; return; } else if(type==='atan'){ const v=Math.atan(deg)*180/Math.PI; res=\`atan(\${deg})=\${v.toFixed(4)}°\`; document.getElementById('trigRes').innerHTML=res; window.lastCalcResult=res; return; } document.getElementById('trigRes').innerHTML=\`\${type}(\${deg}°) = \${res.toFixed(6)} (rad: \${rad.toFixed(4)})\`; window.lastCalcResult=res; }
function calcPyth(){ const a=parseFloat(document.getElementById('pyA').value)||0, b=parseFloat(document.getElementById('pyB').value)||0; const c=Math.sqrt(a*a+b*b); document.getElementById('pythRes').innerHTML=\`a=\${a}, b=\${b} → c=√(a²+b²)=\${c.toFixed(6)}\`; window.lastCalcResult=c; }
function calcPythAB(){ const b=parseFloat(document.getElementById('pyB').value)||0, c=parseFloat(document.getElementById('pyC').value)||0; const a=Math.sqrt(c*c-b*b); document.getElementById('pythRes').innerHTML=\`c=\${c}, b=\${b} → a=√(c²-b²)=\${a.toFixed(6)}\`; window.lastCalcResult=a; }
function calcRoot(type){ const n=parseFloat(document.getElementById('rootNum').value)||0, exp=parseFloat(document.getElementById('powExp').value)||2; let r=0; if(type==='sqrt') r=Math.sqrt(n); else if(type==='cbrt') r=Math.cbrt(n); else if(type==='square') r=n*n; else if(type==='cube') r=n*n*n; else if(type==='pow') r=Math.pow(n,exp); else if(type==='log') r=Math.log10(n); else if(type==='ln') r=Math.log(n); else if(type==='fact'){ r=1; for(let i=2;i<=n;i++) r*=i; } document.getElementById('rootRes').innerHTML=\`\${type}(\${n}) = \${r}\`; window.lastCalcResult=r; }
function calcStar(){ const inp=document.getElementById('starInput').value.toLowerCase(); let r=''; if(inp.includes('fényév')){ const n=parseFloat(inp)||1; r=\`\${n} fényév = \${(n*9.461e12).toExponential(4)} km = \${(n*63241).toFixed(1)} AU = \${(n*0.3066).toFixed(4)} parszek\`; } else if(inp.includes('au')){ const n=parseFloat(inp)||1; r=\`\${n} AU = \${(n*149.6e6).toFixed(0)} km = \${(n/63241).toFixed(6)} fényév\`; } else if(inp.includes('c=')||inp.includes('e=mc')){ r='E=mc², c=299792458 m/s'; } else { r='Ismeretlen: írd pl. "2 fényév", "1 AU km", "5 kg N"'; } document.getElementById('starRes').innerHTML=r; window.lastCalcResult=r; }
function calcBinary(){ const txt=document.getElementById('binInput').value.trim(); let num; if(/^[01]+$/.test(txt)) num=parseInt(txt,2); else if(/^[0-9a-fA-F]+$/.test(txt) && txt.match(/[a-fA-F]/)) num=parseInt(txt,16); else num=parseInt(txt,10); if(isNaN(num)){ document.getElementById('binRes').innerHTML='Hiba'; return; } document.getElementById('binRes').innerHTML=\`Dec: \${num}<br>Bin: \${num.toString(2)}<br>Hex: \${num.toString(16).toUpperCase()}<br>Oct: \${num.toString(8)}<br>ASCII: \${num>=32&&num<=126?String.fromCharCode(num):'-'}<br>Byte: \${(num/1024).toFixed(2)} KB\`; window.lastCalcResult=num; }

function notePlainText(html){const d=document.createElement('div');d.innerHTML=html||'';return (d.innerText||d.textContent||'').replace(/\\s+/g,' ').trim();}
function makeNoteTitle(html){return notePlainText(html).slice(0,45)||'Jegyzet';}
function dateText(ts){return new Date(ts||Date.now()).toLocaleString('hu-HU',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});}
function persistNotes(){localStorage.setItem('v26fix',JSON.stringify(notes));renderNotes();}
function upsertCurrentNote(){
  const ed=document.getElementById('editor'); if(!ed)return null; const c=ed.innerHTML; if(!notePlainText(c))return null; const now=Date.now();
  if(currentEditId){const idx=notes.findIndex(x=>String(x.id)===String(currentEditId));if(idx>-1){notes[idx].content=c;notes[idx].title=makeNoteTitle(c);notes[idx].updated=now;notes[idx].color=ed.style.background||notes[idx].color||'#0f0f23';return notes[idx];}}
  const n={id:now,title:makeNoteTitle(c),content:c,created:now,updated:now,color:ed.style.background||'#0f0f23'};notes.unshift(n);currentEditId=n.id;return n;
}

function saveGitHubSettings(){
  const c={owner:document.getElementById('ghOwner').value.trim(),repo:document.getElementById('ghRepo').value.trim(),branch:(document.getElementById('ghBranch').value.trim()||'main'),path:(document.getElementById('ghPath').value.trim()||'V26 notes.json'),token:document.getElementById('ghToken').value.trim()};
  if(!c.owner||!c.repo||!c.token){setGitHubStatus('❗ Add meg a GitHub felhasználót, repositoryt és a tokent.');return;}
  localStorage.setItem(GITHUB_CONFIG_KEY,JSON.stringify(c));
  startGitHubPolling();

function clearGitHubSettings(){localStorage.removeItem(GITHUB_CONFIG_KEY);githubLastSha=null;clearInterval(githubPollTimer);setGitHubStatus('GitHub: kapcsolat törölve.');}
function githubApiUrl(c){return \`https://api.github.com/repos/\${encodeURIComponent(c.owner)}/\${encodeURIComponent(c.repo)}/contents/\${c.path.split('/').map(encodeURIComponent).join('/')}?ref=\${encodeURIComponent(c.branch)}\`;}
function githubHeaders(c){return {'Accept':'application/vnd.github+json','Authorization':'Bearer '+c.token,'X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'};}
function bytesToBase64Utf8(text){
  const bytes=new TextEncoder().encode(text); let bin=''; for(let i=0;i<bytes.length;i+=0x8000)bin+=String.fromCharCode(...bytes.subarray(i,i+0x8000)); return btoa(bin);
}
function base64ToUtf8(b64){
  const bin=atob(b64.replace(/\\n/g,'')); const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0)); return new TextDecoder().decode(bytes);
}
function noteMapById(arr){
  const m=new Map();
  (Array.isArray(arr)?arr:[]).forEach(n=>{if(n&&n.id!=null)m.set(String(n.id),n);});
  return m;
}
function mergeNotes(localArr,remoteArr){
  const m=noteMapById(remoteArr);
  (Array.isArray(localArr)?localArr:[]).forEach(local=>{
    if(!local||local.id==null)return;
    const key=String(local.id), remote=m.get(key);
    if(!remote || Number(local.updated||0)>=Number(remote.updated||0))m.set(key,local);
  });
  return Array.from(m.values()).sort((a,b)=>Number(b.updated||0)-Number(a.updated||0));
}
function githubPayload(noteArr=notes){
  const cleanNotes=mergeNotes([],noteArr).map(n=>({id:n.id,title:n.title,content:n.content,created:n.created,updated:n.updated,color:n.color||'#0f0f23'}));
  const updated=Math.max(0,...cleanNotes.map(n=>Number(n.updated)||0));
  return JSON.stringify({version:GITHUB_DATA_VERSION,updated,notes:cleanNotes},null,2);
}
async function githubRead(){
  const c=getGitHubConfig(); if(!c)return null;
  const r=await fetch(githubApiUrl(c),{headers:githubHeaders(c),cache:'no-store'});
  if(r.status===404)return {sha:null,data:null};
  if(!r.ok)throw new Error('GitHub olvasási hiba: HTTP '+r.status);
  const responseText=await r.text();
  let j;
  try{j=JSON.parse(responseText);}catch(e){throw new Error('GitHub API válasz nem érvényes JSON.');}
  const raw=base64ToUtf8(j.content||'').trim();
   if(!raw) return {sha:j.sha,data:null};
   try{
     const parsed=JSON.parse(raw);
     // Accept the current object format and the older plain array format.
     if(Array.isArray(parsed)) return {sha:j.sha,data:{version:GITHUB_DATA_VERSION,updated:Math.max(0,...parsed.map(n=>Number(n?.updated)||0)),notes:parsed}};
     if(parsed && Array.isArray(parsed.notes)) return {sha:j.sha,data:parsed};
     return {sha:j.sha,data:null};
   }catch(parseErr){
     console.warn('GitHub jegyzetfájl nem érvényes JSON, újraformázás következik:',parseErr.message);
     return {sha:j.sha,data:null};
   }
}
async function githubSync(force=false){
  const c=getGitHubConfig(); if(sharedMode||!c||githubSyncBusy)return false;
  githubSyncBusy=true;
  try{
    let remote=await githubRead();
    const remoteNotes=Array.isArray(remote?.data?.notes)?remote.data.notes:[];
    const localNotes=Array.isArray(notes)?notes:[];
    const merged=mergeNotes(localNotes,remoteNotes);
    const localJson=githubPayload(localNotes);
    const mergedJson=githubPayload(merged);
    const remoteJson=remote?.data?githubPayload(remoteNotes):'';
    const localChanged=mergedJson!==localJson;
    const remoteChanged=mergedJson!==remoteJson;
    notes=merged;
    localStorage.setItem('v26fix',JSON.stringify(notes));
    renderNotes();
    const shouldWrite=force||localChanged||remoteChanged||!remote?.data;
    if(!shouldWrite){
      githubLastSha=remote?.sha||null;
      githubLastRemoteUpdated=Number(remote?.data?.updated)||0;
      githubEditorDirty=false;
      setGitHubStatus('☁️ GitHub és a készülék már szinkronban van.',true);
      return true;
    }
    const payload=githubPayload(merged);
    const body={message:'V26 automatikus jegyzet-szinkron (egyesítés)',content:bytesToBase64Utf8(payload),branch:c.branch};
    if(remote?.sha)body.sha=remote.sha;
    let r=await fetch(githubApiUrl(c),{method:'PUT',headers:githubHeaders(c),body:JSON.stringify(body),cache:'no-store'});
    if(r.status===409){
      remote=await githubRead();
      const again=mergeNotes(notes,Array.isArray(remote?.data?.notes)?remote.data.notes:[]);
      notes=again; localStorage.setItem('v26fix',JSON.stringify(notes)); renderNotes();
      const retry={message:'V26 automatikus jegyzet-szinkron (ütközés után)',content:bytesToBase64Utf8(githubPayload(again)),branch:c.branch};
      if(remote?.sha)retry.sha=remote.sha;
      r=await fetch(githubApiUrl(c),{method:'PUT',headers:githubHeaders(c),body:JSON.stringify(retry),cache:'no-store'});
    }
    if(!r.ok){let msg='HTTP '+r.status;try{const x=await r.json();if(x.message)msg+=' — '+x.message;}catch(e){}throw new Error(msg);}
    const out=await r.json();
    githubLastSha=out.content?.sha||null;
    githubLastRemoteUpdated=Math.max(0,...notes.map(n=>Number(n.updated)||0));
    githubEditorDirty=false;
    setGitHubStatus('☁️ Közös jegyzettár szinkronizálva '+new Date().toLocaleTimeString('hu-HU'),true);
    return true;
  }catch(e){
    setGitHubStatus('⚠️ GitHub szinkron hiba: '+e.message);
    console.error(e); return false;
  }finally{githubSyncBusy=false;}
}
async function githubManualSync(){
  const n=saveNoteAuto(); if(!n){alert('Üres a jegyzet, írj valamit!');return;}
  if(!getGitHubConfig()){openGitHubSettings();setGitHubStatus('❗ Előbb állítsd be a GitHub kapcsolatot.');return;}
  const ok=await githubSync(true); if(ok)alert('☁️ A jegyzetek felkerültek GitHubra.');
}
async function loadFromGitHub(showAlert=false){
  const c=getGitHubConfig(); if(!c){openGitHubSettings();return false;}
  try{
    const remote=await githubRead();
    if(!remote?.data||!Array.isArray(remote.data.notes)){
      setGitHubStatus('GitHub: még nincs v26-notes.json, az első mentés létrehozza.',true);return false;
    }
    notes=mergeNotes(notes,remote.data.notes);
    localStorage.setItem('v26fix',JSON.stringify(notes)); renderNotes();
    githubLastSha=remote.sha; githubLastRemoteUpdated=Number(remote.data.updated)||0;
    setGitHubStatus('🔄 GitHub → készülék: a jegyzetek egyesítve.',true);
    if(showAlert)alert('🔄 A GitHub-jegyzetek betöltve és egyesítve.');
    return true;
  }catch(e){setGitHubStatus('⚠️ GitHub betöltési hiba: '+e.message);if(showAlert)alert('GitHub betöltési hiba: '+e.message);return false;}
}
async function githubPoll(){
  const c=getGitHubConfig();
  if(!c||githubSyncBusy||githubEditorDirty)return;
  try{
    const remote=await githubRead();
    if(!remote?.data||!Array.isArray(remote.data.notes))return;
    const merged=mergeNotes(notes,remote.data.notes);
    const changed=JSON.stringify(merged)!==JSON.stringify(notes);
    if(changed){
      notes=merged; localStorage.setItem('v26fix',JSON.stringify(notes)); renderNotes();
      githubLastSha=remote.sha; githubLastRemoteUpdated=Number(remote.data.updated)||0;
      setGitHubStatus('🔄 GitHub: új jegyzet érkezett — egyesítve.',true);
    }
  }catch(e){console.warn('GitHub automatikus frissítés:',e.message);}
}
function startGitHubPolling(){
  clearInterval(githubPollTimer);
  if(getGitHubConfig()){
    githubPoll();
    githubPollTimer=setInterval(githubPoll,5000);
  }
}

function printSavedNote(id){const n=notes.find(x=>String(x.id)===String(id));if(!n)return;const w=window.open('','_blank');if(!w){alert('A nyomtatási ablakot a böngésző blokkolta.');return;}w.document.write(\`<!doctype html><html lang="hu"><head><meta charset="utf-8"><title>\${escapeHtml(n.title)}</title><style>body{font-family:Arial,sans-serif;padding:30px;color:#111}h1{font-size:24px}small{color:#666}.content{line-height:1.6}</style></head><body><h1>\${escapeHtml(n.title)}</h1><small>\${dateText(n.updated)}</small><hr><div class="content">\${n.content}</div></body></html>\`);w.document.close();w.focus();setTimeout(()=>w.print(),250);}
function escapeHtml(x){return String(x||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function showNoteActions(id){const n=notes.find(x=>String(x.id)===String(id));if(!n)return;const old=document.getElementById('noteActionMenu');if(old)old.remove();const menu=document.createElement('div');menu.id='noteActionMenu';menu.style.cssText='position:fixed;z-index:10000;left:50%;top:50%;transform:translate(-50%,-50%);width:min(320px,88vw);background:#111827;border:1px solid #475569;border-radius:16px;padding:14px;box-shadow:0 20px 60px rgba(0,0,0,.65);color:#fff';menu.innerHTML=\`<div style="font-weight:900;font-size:15px;margin-bottom:4px">📒 \${escapeHtml(n.title)}</div><div style="font-size:11px;color:#94a3b8;margin-bottom:12px">📅 \${dateText(n.updated)}</div><button class="btn" style="width:100%;margin:4px 0" data-act="open">📖 Megnyitás / szerkesztés</button><button class="btn" style="width:100%;margin:4px 0" data-act="share">📤 Megosztás</button><button class="btn" style="width:100%;margin:4px 0" data-act="print">🖨️ Nyomtatás</button><button class="btn" style="width:100%;margin:4px 0;background:#991b1b" data-act="delete">🗑️ Törlés</button><button class="btn" style="width:100%;margin:4px 0;background:#334155" data-act="close">✖️ Bezár</button>\`;menu.addEventListener('click',e=>{const b=e.target.closest('button[data-act]');if(!b)return;const a=b.dataset.act;if(a==='open'){openSavedNote(id);menu.remove();}if(a==='share')shareSavedNote(id);if(a==='print')printSavedNote(id);if(a==='delete'){deleteSavedNote(id);menu.remove();}if(a==='close')menu.remove();});document.body.appendChild(menu);}

let sharedMode=new URLSearchParams(location.search).get('shared')==='1';
let sharedNotes=[];
let sharedDataUrl=new URLSearchParams(location.search).get('data')||'https://raw.githubusercontent.com/imregabor323-arch/UltraV26/main/V26%20notes.json';

function sharedRawUrl(){
  try{return decodeURIComponent(sharedDataUrl);}catch(e){return sharedDataUrl;}
}
async function loadSharedNotes(){
  const banner=document.getElementById('sharedBanner');
  if(banner)banner.style.display='block';
  try{
    const r=await fetch(sharedRawUrl()+(sharedRawUrl().includes('?')?'&':'?')+'v='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const data=await r.json();
    sharedNotes=Array.isArray(data.notes)?data.notes:[];
    renderNotes();
  }catch(e){
    sharedNotes=[];
    renderNotes();
    if(banner)banner.innerHTML='<b>⚠️ A megosztott jegyzetek nem tölthetők be.</b><br><span style="font-size:12px">Ellenőrizd, hogy a GitHub repository nyilvános-e, és a v26-notes.json elérhető-e.</span>';
  }
}
function openSharedNote(id){
  const n=sharedNotes.find(x=>String(x.id)===String(id)); if(!n)return;
  const old=document.getElementById('sharedNoteModal');if(old)old.remove();
  const modal=document.createElement('div');modal.id='sharedNoteModal';
  modal.style.cssText='position:fixed;inset:0;z-index:10020;background:rgba(0,0,0,.88);padding:14px;overflow:auto';
  modal.innerHTML=\`<div style="max-width:760px;margin:20px auto;background:#111827;border:1px solid #475569;border-radius:16px;padding:16px;color:#fff">
    <div style="display:flex;justify-content:space-between;gap:8px;align-items:center">
      <div><h2 style="margin:0 0 4px">\${escapeHtml(n.title)}</h2><small style="color:#94a3b8">🔒 Csak olvasható • \${dateText(n.updated)}</small></div>
      <button class="btn" data-close>✖️</button>
    </div>
    <hr style="border-color:#334155">
    <div class="shared-content" style="line-height:1.65">\${n.content||''}</div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:14px">
      <button class="btn" data-speak>🔊 Felolvasás</button>
      <button class="btn" data-print>🖨️ Nyomtatás</button>
      <button class="btn" data-download>⬇️ Letöltés</button>
      <button class="btn" data-copy>📋 Szöveg másolása</button>
      <button class="btn" data-close>✖️ Bezár</button>
    </div>
  </div>\`;
  modal.addEventListener('click',e=>{
    if(e.target===modal||e.target.closest('[data-close]')){modal.remove();return;}
    if(e.target.closest('[data-speak]'))speakText(notePlainText(n.content));
    if(e.target.closest('[data-print]'))printNoteObject(n);
    if(e.target.closest('[data-download]'))downloadNoteObject(n);
    if(e.target.closest('[data-copy]')&&navigator.clipboard)navigator.clipboard.writeText(notePlainText(n.content));
  });
  document.body.appendChild(modal);
}
function printNoteObject(n){
  const w=window.open('','_blank');if(!w){alert('A nyomtatási ablakot a böngésző blokkolta.');return;}
  w.document.write(\`<!doctype html><html lang="hu"><head><meta charset="utf-8"><title>\${escapeHtml(n.title)}</title><style>body{font-family:Arial,sans-serif;padding:30px;color:#111;line-height:1.6}</style></head><body><h1>\${escapeHtml(n.title)}</h1><small>\${dateText(n.updated)}</small><hr>\${n.content}</body></html>\`);
  w.document.close();w.focus();setTimeout(()=>w.print(),250);
}
function downloadNoteObject(n){
  const html='<!doctype html><html lang="hu"><meta charset="utf-8"><title>'+escapeHtml(n.title)+'</title><body style="font-family:Arial;padding:20px;line-height:1.6">'+n.content+'</body></html>';
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download=(n.title||'V26-jegyzet').replace(/[^a-z0-9áéíóöőúüű -]/gi,'_')+'.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function renderNotes(){
  const list=document.getElementById('notesList');if(!list)return;
  const empty='<div style="padding:14px;color:#94a3b8;border:1px dashed #475569;border-radius:10px">Még nincs mentett jegyzet.</div>';
  const sharedHtml=sharedMode&&sharedNotes.length?\`<div style="margin:8px 0;font-weight:900;color:#67e8f9">🔒 Megosztott jegyzetek — csak olvasható</div>\`+sharedNotes.map(n=>\`<div class="note saved-note" data-shared-id="\${n.id}" style="border-left:4px solid #2dd4bf;touch-action:manipulation"><div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start"><div><b>\${escapeHtml(n.title)}</b><div style="font-size:11px;opacity:.7;margin-top:3px">🔒 Csak olvasható • \${dateText(n.updated)}</div></div><button class="btn" style="margin:0;padding:5px 8px" onclick="openSharedNote(\${n.id})">📖</button></div><div style="font-size:11px;opacity:.72;margin-top:6px">\${escapeHtml(notePlainText(n.content).slice(0,90))}</div></div>\`).join(''):'';
  const localHtml=notes.length?\`<div style="margin:14px 0 8px;font-weight:900;color:#c4b5fd">✍️ Saját jegyzeteid ezen az eszközön</div>\`+notes.map(n=>\`<div class="note saved-note" data-id="\${n.id}" style="border-left:4px solid #8b7fe8;touch-action:manipulation"><div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start"><div><b>\${escapeHtml(n.title)}</b><div style="font-size:11px;opacity:.7;margin-top:3px">📅 \${dateText(n.updated)}</div></div><div style="display:flex;gap:5px;align-items:center"><button class="btn" style="margin:0;padding:5px 8px" onclick="openSavedNote(\${n.id})">📖</button><button class="btn" style="margin:0;padding:5px 8px;background:#991b1b;color:#fff" onclick="deleteSavedNote(\${n.id})">🗑️</button></div></div><div style="font-size:11px;opacity:.72;margin-top:6px">\${escapeHtml(notePlainText(n.content).slice(0,90))}</div></div>\`).join(''):empty;
  list.innerHTML=sharedHtml+localHtml;
}
let notePressTimer=null;
document.addEventListener('pointerdown',e=>{const el=e.target.closest('.saved-note');if(!el||e.target.closest('button'))return;clearTimeout(notePressTimer);notePressTimer=setTimeout(()=>showNoteActions(el.dataset.id),550);});
document.addEventListener('pointerup',()=>clearTimeout(notePressTimer));document.addEventListener('pointercancel',()=>clearTimeout(notePressTimer));
renderNotes();
if(sharedMode){

}else{

}

<script>
// ULTRA V26 - MINDEN JAVÍTÁS EGYBEN - V5 FINAL
(function(){
  // 1. 20+ KÉP - IndexedDB
  const DB='v26-notes-idb', ST='notes_store', KY='all_notes_v1';
  function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,2);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(ST))r.result.createObjectStore(ST);if(!r.result.objectStoreNames.contains('chapters'))r.result.createObjectStore('chapters');};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
  async function idbGet(){try{const db=await openDB();return await new Promise((a,b)=>{const q=db.transaction(ST,'readonly').objectStore(ST).get(KY);q.onsuccess=()=>a(q.result||null);q.onerror=()=>b(q.error);});}catch(e){return null;}}
  async function idbPut(arr){try{const db=await openDB();await new Promise((a,b)=>{const q=db.transaction(ST,'readwrite').objectStore(ST).put(arr,KY);q.onsuccess=()=>a();q.onerror=()=>b(q.error);});return true;}catch(e){return false;}}
  function safeSet(k,v){try{localStorage.setItem(k,v);return true;}catch(e){try{localStorage.removeItem(k);}catch(_){}return false;}}
  window.persistNotes=async function(){const ok=await idbPut(notes);safeSet('v26fix',JSON.stringify(notes));try{renderNotes();}catch(_){}return ok;};
  window.upsertCurrentNote=function(){const ed=document.getElementById('editor');if(!ed)return null;const c=ed.innerHTML;const d=document.createElement('div');d.innerHTML=c;const plain=(d.innerText||'').replace(/\\s+/g,' ').trim();if(!plain&&!c.includes('<img'))return null;const now=Date.now();if(window.currentEditId!=null){const idx=notes.findIndex(x=>String(x.id)===String(window.currentEditId));if(idx>-1){notes[idx].content=c;notes[idx].title=plain.slice(0,45)||'Jegyzet';notes[idx].updated=now;notes[idx].color=ed.style.background||notes[idx].color||'#0f0f23';return notes[idx];}}const n={id:now,title:plain.slice(0,45)||'Jegyzet',content:c,created:now,updated:now,color:ed.style.background||'#0f0f23'};notes.unshift(n);window.currentEditId=n.id;return n;};
  window.saveNoteAuto=async function(){const n=window.upsertCurrentNote();if(n){await window.persistNotes();safeSet('v26auto',JSON.stringify(n));if(!window._pauseGitHubSync&&!window.sharedMode)scheduleGitHubSync();}return n;};
  window.addTinyImage=function(){const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.multiple=true;inp.style.display='none';document.body.appendChild(inp);inp.onchange=async e=>{const files=Array.from(e.target.files||[]).filter(f=>f.type.startsWith('image/'));if(!files.length){document.body.removeChild(inp);return;}const htmls=await Promise.all(files.map(async f=>{try{const d=await window.compressImage(f,900,0.68);const id='img_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);return '<img id="'+id+'" src="'+d+'" class="mini-img">';}catch(_){return '';} }));const batch=htmls.join('');if(batch){window.insertAtCursor(imageGridHtml(batch));await new Promise(r=>setTimeout(r,50));await window.saveNoteAuto();}document.body.removeChild(inp);};inp.click();};
  window.handleImageFiles=function(list){const files=Array.from(list||[]).filter(f=>f.type.startsWith('image/'));if(!files.length)return false;(async()=>{clearTimeout(window.githubSyncTimer);const htmls=await Promise.all(files.map(async f=>{try{const d=await window.compressImage(f,900,0.68);const id='img_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);return '<img id="'+id+'" src="'+d+'" class="mini-img">';}catch(_){return '';} }));const batch=htmls.join('');if(batch){window.insertAtCursor(imageGridHtml(batch));await new Promise(r=>setTimeout(r,50));await window.saveNoteAuto();}})();return true;};
  (async()=>{const idb=await idbGet();let ls=[];try{ls=JSON.parse(localStorage.getItem('v26fix')||'[]');}catch(_){}if(Array.isArray(idb)&&idb.length){const cnt=h=>(String(h||'').match(/<img/gi)||[]).length;const m=new Map();[...idb,...ls].forEach(n=>{if(!n||!n.id)return;const k=String(n.id);const ex=m.get(k);if(!ex)m.set(k,n);else if(cnt(n.content)>cnt(ex.content)||cnt(n.content)===cnt(ex.content)&&Number(n.updated)>Number(ex.updated))m.set(k,n);});notes=Array.from(m.values()).sort((a,b)=>Number(b.updated)-Number(a.updated));await idbPut(notes);safeSet('v26fix',JSON.stringify(notes));try{renderNotes();}catch(_){}}else if(ls.length){await idbPut(ls);}})();

  // 2. BETŰMÉRET - lineáris 8-72, nincs ugrás
  window.fontSize=function(v){
    const size=Math.max(6,Math.min(120,parseInt(v)||12));
    const ed=document.getElementById('editor');if(!ed)return;
    try{localStorage.setItem('v26_fontSize',String(size));}catch(_){}
    const selEl=document.getElementById('fontSizeSelect');if(selEl)selEl.value=String(size);
    ed.focus();
    try{
      const sel=window.getSelection();if(!sel||!sel.rangeCount){ed.style.fontSize=size+'px';if(window.saveNoteAuto)saveNoteAuto();return;}
      const range=sel.getRangeAt(0);
      if(!range.collapsed){
        const span=document.createElement('span');span.style.fontSize=size+'px';span.style.lineHeight='1.6';
        try{span.appendChild(range.extractContents());}catch(e){const c=range.cloneContents();span.appendChild(c);range.deleteContents();}
        range.insertNode(span);sel.removeAllRanges();const nr=document.createRange();nr.setStartAfter(span);nr.collapse(true);sel.addRange(nr);
      }else{
        ed.style.fontSize=size+'px';
        const span=document.createElement('span');span.style.fontSize=size+'px';span.textContent='\\u200B';range.insertNode(span);
        const nr=document.createRange();nr.setStart(span,1);nr.setEnd(span,1);sel.removeAllRanges();sel.addRange(nr);
      }
    }catch(e){ed.style.fontSize=size+'px';}
    if(window.saveNoteAuto)saveNoteAuto();
  };
  window.loadSavedFontSize=function(){try{const s=localStorage.getItem('v26_fontSize');if(s){const ed=document.getElementById('editor');if(ed)ed.style.fontSize=parseInt(s)+'px';const sel=document.getElementById('fontSizeSelect');if(sel)sel.value=s;}}catch(_){}};
  setTimeout(window.loadSavedFontSize,600);

  // 3. HANGOS - START/STOP
  window.v26SpeechQueue=[];window.v26SpeechIndex=0;window.v26SpeechStopped=false;window.v26SpeechRunId=0;
  window.v26SpeechChunks=function(t){t=String(t||'').replace(/\\s+/g,' ').trim();if(!t)return[];const ch=[];let s=0;while(s<t.length){let e=Math.min(s+180,t.length);if(e<t.length){let d=t.lastIndexOf('.',e);let c=t.lastIndexOf(',',e);let cut=Math.max(d,c);if(cut>s+40)e=cut+1;}ch.push(t.slice(s,e).trim());s=e;}return ch.filter(Boolean);};
  window.v26GetVoices=function(){try{return speechSynthesis.getVoices()||[];}catch(_){return [];}};
  window.v26PickHungarianVoice=function(){const vs=window.v26GetVoices();return vs.find(v=>/dora/i.test(v.name))||vs.find(v=>/hu-HU/i.test(v.lang))||vs.find(v=>/hu/i.test(v.lang))||vs[0]||null;};
  window.v26WarmSpeechEngine=function(){try{speechSynthesis.resume();speechSynthesis.getVoices();return true;}catch(_){return false;}};
  window.v26SpeakCurrentText=function(){const txt=window.currentBibleReferenceText||'';if(!txt.trim())return false;const ss=speechSynthesis;if(!ss||!window.SpeechSynthesisUtterance)return false;try{ss.cancel();ss.resume();window.v26SpeechStopped=false;window.v26SpeechRunId++;const run=window.v26SpeechRunId;window.v26SpeechQueue=window.v26SpeechChunks(txt);window.v26SpeechIndex=0;const play=()=>{if(run!==window.v26SpeechRunId||window.v26SpeechStopped)return;if(window.v26SpeechIndex>=window.v26SpeechQueue.length){const st=document.getElementById('speechStatus');if(st)st.textContent='✅ Kész';const b=document.getElementById('btnStartSpeech');if(b)b.textContent='▶️ START';return;}const u=new SpeechSynthesisUtterance(window.v26SpeechQueue[window.v26SpeechIndex++]);u.lang='hu-HU';u.rate=0.95;const v=window.v26PickHungarianVoice();if(v)u.voice=v;const st=document.getElementById('speechStatus');if(st)st.textContent='🔊 '+window.v26SpeechIndex+'/'+window.v26SpeechQueue.length;u.onend=()=>{if(run===window.v26SpeechRunId&&!window.v26SpeechStopped)setTimeout(play,80);};u.onerror=()=>{setTimeout(play,200);};ss.speak(u);};play();return true;}catch(_){return false;}};
  window.startSpeech=function(){const ed=document.getElementById('editor');const txt=ed?(ed.innerText||'') : '';if(!txt.trim())return;try{speechSynthesis.cancel();}catch(_){}window.v26SpeechStopped=false;const b=document.getElementById('btnStartSpeech');if(b)b.textContent='⏸️ OLVAS...';window.currentBibleReferenceText=txt;window.v26WarmSpeechEngine();setTimeout(()=>window.v26SpeakCurrentText(),100);};
  window.stopSpeech=function(){window.v26SpeechStopped=true;window.v26SpeechRunId++;window.v26SpeechQueue=[];window.v26SpeechIndex=0;try{speechSynthesis.cancel();}catch(_){}const st=document.getElementById('speechStatus');if(st)st.textContent='⏹️ Leállítva';const b=document.getElementById('btnStartSpeech');if(b)b.textContent='▶️ START';};
  window.speakText=function(t){window.currentBibleReferenceText=String(t||'').replace(/<[^>]*>/g,' ').trim();window.v26WarmSpeechEngine();setTimeout(()=>window.v26SpeakCurrentText(),100);};
  window.speakNote=function(){window.startSpeech();};

  // 4. HOSSZÚ SZÖVEG PASTE - ne legyen apró
  setTimeout(()=>{
    const ed=document.getElementById('editor');if(!ed)return;
    function curSize(){try{const s=localStorage.getItem('v26_fontSize');if(s)return parseInt(s);}catch(_){}return parseInt(window.getComputedStyle(ed).fontSize)||16;}
    function normalize(){
      const cs=curSize();
      ed.querySelectorAll('*').forEach(el=>{
        if(el.classList&&(el.classList.contains('mini-img')||el.classList.contains('rubrika-box')))return;
        const st=el.getAttribute('style')||'';const m=st.match(/font-size:\\s*([0-9.]+)px/i);
        if(m){const sz=parseFloat(m[1]);if(sz<10||sz<cs*0.7)el.style.fontSize=cs+'px';}
        if(el.tagName==='FONT'&&el.getAttribute('size')){const sz=parseInt(el.getAttribute('size'));if(sz<=2){el.removeAttribute('size');el.style.fontSize=cs+'px';}}
      });
    }
    ed.addEventListener('paste', function(e){
      try{
        const cd=e.clipboardData;if(cd){
          const html=cd.getData('text/html');const text=cd.getData('text/plain');
          if(html&&html.length>2000&&/font-size:\\s*[0-9]\\s*px/i.test(html)){
            e.preventDefault();
            const cs=curSize();
            const span=document.createElement('span');span.style.fontSize=cs+'px';span.style.lineHeight='1.6';
            span.textContent=text;
            document.execCommand('insertHTML',false,span.outerHTML);
            setTimeout(()=>{normalize();if(window.saveNoteAuto)saveNoteAuto();},60);
            return;
          }
        }
      }catch(_){}
      setTimeout(()=>{normalize();if(window.saveNoteAuto)saveNoteAuto();},120);
    });
  },800);

  console.log('V26 V5 FINAL - MINDEN JAVÍTVA');
