<!DOCTYPE html><html lang="hu"><head><meta charset="utf-8"><title>ULTRA V26 – Űrhajó vezérlőpult</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#000;--fg:#d6ecff;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
#ck{position:fixed;left:50%;top:50%;width:768px;height:512px;transform:translate(-50%,-50%);background:#000;font-family:"Segoe UI",system-ui,Arial,sans-serif;color:var(--fg);--u:1px}
#fr{transform-origin:0 0}
#ck>img{position:absolute;inset:0;width:100%;height:100%;display:block}
.a{position:absolute}
#fr,#vf{border:0;background:#000;object-fit:contain}
#vf{display:none}
#cb{background:linear-gradient(#06142e,#040c1e);display:flex;align-items:center;gap:calc(var(--u)*14);padding:0 calc(var(--u)*18);font-size:calc(var(--u)*15)}
#cb button{background:none;border:0;color:#fff;cursor:pointer;font-size:calc(var(--u)*22);padding:0 calc(var(--u)*4);line-height:1}
#bar{flex:1;height:calc(var(--u)*6);background:#ffffff30;border-radius:9px;position:relative;cursor:pointer}
#fill{position:absolute;left:0;top:0;bottom:0;background:#2aa8ff;border-radius:9px;width:0}
#fill:after{content:"";position:absolute;right:calc(var(--u)*-7);top:calc(var(--u)*-4);width:calc(var(--u)*14);height:calc(var(--u)*14);border-radius:50%;background:#58c8ff;box-shadow:0 0 8px #58c8ff}
#hd{border:1px solid #7fc0ff;border-radius:3px;font-size:calc(var(--u)*11);padding:0 calc(var(--u)*4);cursor:pointer}
#hd.off{opacity:.45}
.h{position:absolute;cursor:pointer;border-radius:6px;background:transparent;border:0;padding:0;display:block;color:inherit}
.h:hover{background:#4fb0ff22;box-shadow:0 0 0 1px #4fb0ff88 inset}
.pl.on{background:#4fb0ff33;box-shadow:0 0 0 2px #58c8ff inset}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;mix-blend-mode:screen}
#scan{display:none;pointer-events:none;background:repeating-linear-gradient(0deg,#0006 0 2px,transparent 2px 4px)}
#toast{position:absolute;left:50%;top:3%;transform:translateX(-50%);background:#06142ecc;border:1px solid #58c8ff;border-radius:8px;padding:calc(var(--u)*8) calc(var(--u)*18);font-size:calc(var(--u)*18);opacity:0;transition:opacity .3s;pointer-events:none;z-index:9;text-align:center}
#set{display:none;background:#06142ef2;border:1px solid #58c8ff;border-radius:10px;padding:calc(var(--u)*12);z-index:8;font-size:calc(var(--u)*15)}
#set b{display:block;margin-bottom:calc(var(--u)*6);color:#7fc0ff}
#set button{background:#0f2a66;color:#fff;border:1px solid #2a6cd6;border-radius:5px;padding:calc(var(--u)*4) calc(var(--u)*10);margin:calc(var(--u)*2);cursor:pointer;font-size:calc(var(--u)*14)}
#set button.on{background:#2a6cd6}
#hint{position:absolute;left:0;right:0;bottom:.5%;text-align:center;font-size:calc(var(--u)*13);color:#9fc6ff99;pointer-events:none}
</style></head><body>

ng:0 6vw;animation:ttl 9s ease-in-out 1s both}\n@keyframes ttl{0%{opacity:0;letter-spacing:.3em}25%{opacity:1;letter-spacing:.08em}75%{opacity:1}100%{opacity:0}}\nbody.idle{cursor:none}\n<\/style>\n<\/head>\n<body>\n<canvas id=\"uni\"><\/canvas>\n<div id=\"vig\"><\/div>\n<div id=\"ttl\">V\u00e9gtelen utaz\u00e1s az \u00e9l\u0151 univerzumban<\/div>\n<script>\n/* ULTRA 26 \u2014 \u00e9l\u0151 univerzum motor */\n(function(){\nvar TAU=Math.PI*2,PI=Math.PI;\nfunction rng(seed){var s=seed>>>0;return function(){s=(s+0x6D2B79F5)>>>0;var t=s;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296}}\nfunction mk(w,h){var c=document.createElement('canvas');c.width=w;c.height=h;return c}\nfunction clamp(x,a,b){return x<a?a:x>b?b:x}\nfunction ss(a,b,x){var t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)}\nfunction rnd(a,b){return a+Math.random()*(b-a)}\nfunction mixTo(o,p,k){o[0]+=(p[0]-o[0])*k;o[1]+=(p[1]-o[1])*k;o[2]+=(p[2]-o[2])*k}\n\n/* ---------- periodikus value-noise ---------- */\nfunction Noise(seed){\n  var r=rng(seed),P=new Uint8Array(512),p=[],i,j,t;\n  for(i=0;i<256;i++)p[i]=i;\n  for(i=255;i>0;i--){j=(r()*(i+1))|0;t=p[i];p[i]=p[j];p[j]=t}\n  for(i=0;i<512;i++)P[i]=p[i&255];\n  function h(x,y){return P[P[x&255]+(y&255)]/255}\n  function n2(x,y,px){\n    var xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;\n    var x0=((xi%px)+px)%px,x1=(x0+1)%px;\n    var a=h(x0,yi),b=h(x1,yi),c=h(x0,yi+1),d=h(x1,yi+1);\n    var u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);\n    return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;\n  }\n  return function(u,v,fx,fy,oct){\n    var s=0,amp=.5,tot=0,f=1;\n    for(var o=0;o<oct;o++){s+=amp*n2(u*fx*f,v*fy*f,fx*f);tot+=amp;amp*=.5;f*=2}\n    return s/tot;\n  };\n}\nfunction ramp(st,t,o){\n  var n=st.length;\n  if(t<=0){o[0]=st[0][0];o[1]=st[0][1];o[2]=st[0][2];return}\n  if(t>=1){o[0]=st[n-1][0];o[1]=st[n-1][1];o[2]=st[n-1][2];return}\n  var f=t*(n-1),i=f|0,k=f-i,a=st[i],b=st[i+1];\n  o[0]=a[0]+(b[0]-a[0])*k;o[1]=a[1]+(b[1]-a[1])*k;o[2]=a[2]+(b[2]-a[2])*k;\n}\n\n/* ---------- palett\u00e1k ---------- */\nvar JUP=[[236,220,190],[212,170,120],[168,112,72],[120,74,48],[205,150,100]];\nvar SAT=[[238,222,176],[220,192,128],[196,164,104],[228,204,150]];\nvar NEP=[[22,48,140],[44,96,200],[86,160,240],[160,215,255]];\nvar CY=[[120,210,220],[150,230,235],[185,245,245]];\nvar OCEAN=[[6,28,92],[16,66,150],[40,120,190]];\nvar LAND=[[34,92,44],[64,132,62],[142,128,78],[112,92,70],[225,225,230]];\nvar MARS=[[70,28,20],[140,64,38],[196,110,64],[228,160,110],[240,196,150]];\nvar DARKL=[[18,8,8],[46,20,16],[80,38,28]];\nvar LAV=[[200,50,10],[255,130,20],[255,215,90],[255,250,200]];\nvar ALIEN=[[28,8,70],[110,24,140],[230,70,170],[255,150,200],[80,220,225]];\nvar VEN=[[214,190,100],[188,150,64],[232,214,140],[170,120,60]];\nvar WHITE=[255,255,255];var PLA=[[10,10,60],[50,30,170],[130,60,210],[60,120,255]],PLV=[[255,90,120],[255,170,90],[255,240,210]];\n\n/* ---------- bolyg\u00f3 text\u00far\u00e1k ---------- */\nvar PIX={\n  jup:function(u,v,F,o){var n=F(u,v,4,8,4),m=F(u+.3,v,6,16,3),t=.5+.5*Math.sin(v*34+(n-.5)*7);ramp(JUP,t*.72+m*.28,o)},\n  sat:function(u,v,F,o){var n=F(u,v,4,6,4),t=.5+.5*Math.sin(v*28+(n-.5)*3);ramp(SAT,t*.8+n*.2,o)},\n  nep:function(u,v,F,o,o2){var n=F(u,v,5,6,5),b=.5+.5*Math.sin(v*14+n*4);ramp(NEP,b*.6+n*.4,o);var s=F(u+.5,v,8,10,3);if(s>.6){mixTo(o,WHITE,Math.min(.75,(s-.6)*4))}},\n  cyan:function(u,v,F,o){var n=F(u,v,4,4,4);ramp(CY,.5+.22*Math.sin(v*11)+(n-.5)*.5,o)},\n  earth:function(u,v,F,o){\n    var h=F(u,v,3,3,6);\n    if(h<.52)ramp(OCEAN,h/.52,o);else ramp(LAND,(h-.52)*3.4,o);\n    var p=Math.abs(v-.5)*2,ice=p-.86+(F(u,v,6,6,3)-.5)*.2;\n    if(ice>0)mixTo(o,WHITE,Math.min(1,ice*14));\n    var c=F(u+.17,v,5,5,5),a=ss(.5,.7,c)*.82;\n    if(a>0)mixTo(o,WHITE,a);\n  },\n  mars:function(u,v,F,o){var n=F(u,v,4,4,6),m=F(u+.4,v,8,8,4);ramp(MARS,n*.75+m*.35-.05,o);var p=Math.abs(v-.5)*2;if(p>.93+(m-.5)*.06)mixTo(o,WHITE,Math.min(1,(p-.93)*25))},\n  lava:function(u,v,F,o,o2){\n    var n=F(u,v,5,5,6),r=1-Math.abs(2*n-1);\n    ramp(DARKL,n,o);\n    var e=Math.min(1,Math.max(0,(r-.82)/.16));\n    if(e>0){ramp(LAV,e,o2);mixTo(o,o2,e)}\n  },\n  alien:function(u,v,F,o){var wx=F(u,v,3,3,3),wy=F(u+.5,v,3,3,3),n=F(u+(wx-.5)*.6,v+(wy-.5)*.6,4,4,5);ramp(ALIEN,n*1.4-.2,o)},\n  venus:function(u,v,F,o){var n=F(u,v,3,5,5),t=.5+.5*Math.sin(v*18+(n-.5)*12+F(u,v,6,6,3)*3);ramp(VEN,t,o)},\n  moon:function(u,v,F,o){var n=F(u,v,6,6,6),g=80+n*130;o[0]=g;o[1]=g;o[2]=g*1.03},\n  plasma:function(u,v,F,o,o2){var n=F(u,v,5,5,6),r=1-Math.abs(2*n-1);ramp(PLA,n,o);var e=clamp((r-.8)/.17,0,1);if(e>0){ramp(PLV,e,o2);mixTo(o,o2,e)}}\n};\nfunction craters(cx,W,H,seed,n,maxR,str){\n  var r=rng(seed+99);\n  for(var i=0;i<n;i++){\n    var x=r()*W,y=(.1+r()*.8)*H,rad=2+Math.pow(r(),3)*maxR;\n    var g=cx.createRadialGradient(x,y,rad*.1,x,y,rad);\n    g.addColorStop(0,'rgba(0,0,0,'+str*.55+')');g.addColorStop(.8,'rgba(0,0,0,'+str*.25+')');g.addColorStop(1,'rgba(255,255,255,'+str*.22+')');\n    cx.fillStyle=g;cx.beginPath();cx.arc(x,y,rad,0,TAU);cx.fill();\n  }\n}\nvar DECOR={\n  jup:function(cx,W,H){cx.save();cx.translate(.3*W,.63*H);cx.scale(1.7,1);var R=H*.075,g=cx.createRadialGradient(0,0,2,0,0,R);g.addColorStop(0,'rgba(205,80,50,.95)');g.addColorStop(.6,'rgba(190,100,70,.8)');g.addColorStop(1,'rgba(190,100,70,0)');cx.fillStyle=g;cx.beginPath();cx.arc(0,0,R,0,TAU);cx.fill();cx.restore()},\n  mars:function(cx,W,H,s){craters(cx,W,H,s,70,34,.8)},\n  moon:function(cx,W,H,s){craters(cx,W,H,s,160,40,1)}\n};\nfunction makeTexture(type,seed){\n  var W=1024,H=512,cv=mk(W,H),cx=cv.getContext('2d'),img=cx.createImageData(W,H),d=img.data,F=Noise(seed),o=[0,0,0],o2=[0,0,0],f=PIX[type],x,y,i;\n  for(y=0;y<H;y++){var v=y/H;for(x=0;x<W;x++){f(x/W,v,F,o,o2);i=(y*W+x)*4;d[i]=o[0];d[i+1]=o[1];d[i+2]=o[2];d[i+3]=255}}\n  cx.putImageData(img,0,0);\n  if(DECOR[type])DECOR[type](cx,W,H,seed);\n  var c2=mk(W*2,H),x2=c2.getContext('2d');x2.drawImage(cv,0,0);x2.drawImage(cv,W,0);\n  return c2;\n}\nfunction makeRings(pal,seed){\n  var S=512,cv=mk(S,S),c=cv.getContext('2d'),r=rng(seed),C=S/2,o=[0,0,0],bands=[],i;\n  for(i=0;i<130;i++)bands.push(r());\n  for(var rad=142;rad<=250;rad++){\n    var k=(rad-142)/108,b=bands[(k*128)|0]*.6+bands[Math.min(129,((k*128)|0)+1)]*.4;\n    var a=.14+.78*b;\n    if(k>.5&&k<.58)a*=.07;\n    a*=Math.min(1,k*9,(1-k)*9);\n    ramp(pal,k+(b-.5)*.2,o);\n    c.strokeStyle='rgba('+(o[0]|0)+','+(o[1]|0)+','+(o[2]|0)+','+a.toFixed(3)+')';\n    c.lineWidth=1.5;c.beginPath();c.arc(C,C,rad,0,TAU);c.stroke();\n  }\n  return cv;\n}\nfunction makeShade(){\n  var S=256,cv=mk(S,S),c=cv.getContext('2d');\n  c.save();c.beginPath();c.arc(128,128,128,0,TAU);c.clip();\n  var g=c.createRadialGradient(92,84,0,92,84,230);\n  g.addColorStop(0,'rgba(255,255,255,.26)');g.addColorStop(.3,'rgba(0,0,0,0)');g.addColorStop(.68,'rgba(0,0,0,.25)');g.addColorStop(1,'rgba(0,0,0,.7)');\n  c.fillStyle=g;c.fillRect(0,0,S,S);\n  var g2=c.createRadialGradient(128,128,0,128,128,128);\n  g2.addColorStop(.72,'rgba(0,0,0,0)');g2.addColorStop(1,'rgba(0,0,0,.4)');\n  c.fillStyle=g2;c.fillRect(0,0,S,S);\n  c.restore();\n  return cv;\n}\n\n/* ---------- galaxisok, Tej\u00fat, k\u00f6d\u00f6k ---------- */\nfunction makeGalaxy(seed,pal,arms,twist){\n  var S=640,cv=mk(S,S),c=cv.getContext('2d'),r=rng(seed),R=S*.46,i;\n  c.globalCompositeOperation='lighter';\n  var g=c.createRadialGradient(S/2,S/2,0,S/2,S/2,S/2);\n  g.addColorStop(0,'rgba('+pal.arm+',.28)');g.addColorStop(.5,'rgba('+pal.edge+',.08)');g.addColorStop(1,'rgba('+pal.edge+',0)');\n  c.fillStyle=g;c.fillRect(0,0,S,S);\n  function gs(){return(r()+r()+r()-1.5)}\n  for(i=0;i<9000;i++){\n    var rr=Math.pow(r(),.62)*R,arm=(r()*arms)|0;\n    var ang=arm*TAU/arms+rr/R*twist+gs()*(.55-.3*rr/R);\n    var x=S/2+Math.cos(ang)*rr,y=S/2+Math.sin(ang)*rr;\n    var k=rr/R,col=k<.22?pal.core:(k<.65?pal.arm:pal.edge);\n    c.fillStyle='rgba('+col+','+(.25+.6*r()).toFixed(2)+')';\n    var s=r()<.03?2.4:1.1;c.fillRect(x,y,s,s);\n  }\n  for(i=0;i<46;i++){\n    var rr2=(.25+r()*.7)*R,a2=((r()*arms)|0)*TAU/arms+rr2/R*twist+gs()*.2;\n    var bx=S/2+Math.cos(a2)*rr2,by=S/2+Math.sin(a2)*rr2,br=6+r()*16;\n    var bg=c.createRadialGradient(bx,by,0,bx,by,br);\n    bg.addColorStop(0,'rgba('+pal.pink+',.38)');bg.addColorStop(1,'rgba('+pal.pink+',0)');\n    c.fillStyle=bg;c.beginPath();c.arc(bx,by,br,0,TAU);c.fill();\n  }\n  var cg=c.createRadialGradient(S/2,S/2,0,S/2,S/2,S*.14);\n  cg.addColorStop(0,'rgba(255,250,235,.95)');cg.addColorStop(.25,'rgba('+pal.core+',.6)');cg.addColorStop(1,'rgba('+pal.core+',0)');\n  c.fillStyle=cg;c.beginPath();c.arc(S/2,S/2,S*.14,0,TAU);c.fill();\n  return cv;\n}\nfunction makeNebula(seed,cols){\n  var S=512,cv=mk(S,S),c=cv.getContext('2d'),r=rng(seed);\n  c.globalCompositeOperation='lighter';\n  for(var i=0;i<22;i++){\n    var x=S/2+(r()-.5)*S*.5,y=S/2+(r()-.5)*S*.5,rad=60+r()*130,col=cols[(r()*cols.length)|0];\n    var g=c.createRadialGradient(x,y,0,x,y,rad);\n    g.addColorStop(0,'rgba('+col+',.22)');g.addColorStop(.5,'rgba('+col+',.08)');g.addColorStop(1,'rgba('+col+',0)');\n    c.fillStyle=g;c.beginPath();c.arc(x,y,rad,0,TAU);c.fill();\n  }\n  for(i=0;i<260;i++){c.fillStyle='rgba(255,255,255,'+(.2+r()*.6).toFixed(2)+')';c.fillRect(S/2+(r()-.5)*S*.8,S/2+(r()-.5)*S*.8,1.2,1.2)}\n  var vg=c.createRadialGradient(S/2,S/2,S*.2,S/2,S/2,S/2);\n  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,1)');\n  c.globalCompositeOperation='destination-out';c.fillStyle=vg;c.fillRect(0,0,S,S);\n  return cv;\n}\nfunction makeMilky(){\n  var Wd=2400,Hd=800,cv=mk(Wd,Hd),c=cv.getContext('2d'),r=rng(7),i;\n  c.globalCompositeOperation='lighter';\n  for(i=0;i<36;i++){\n    var x=(i+.5)/36*Wd+(r()-.5)*60,env=Math.exp(-Math.pow((x/Wd-.5)*2.2,2)),rad=150+r()*170;\n    var col=i%3===0?'120,140,255':(i%3===1?'170,120,230':'100,170,255');\n    if(Math.abs(x/Wd-.5)<.14)col='255,190,130';\n    c.save();c.translate(x,Hd/2+(r()-.5)*50);c.scale(1.6,.55);\n    var g=c.createRadialGradient(0,0,0,0, `<p><b>A Vörös Vitorla</b></p><p><b>Prológus.</b> A Meridián Kereskedelmi Társaság évtizedekig szállította a rakományokat az Orion-folyosón. A konvojokat saját biztonsági flottája védte: kísérő vadászok, gyors futárhajók és átalakított teherhajók.</p><p><b>A szakadás.</b> Amikor a társaság megkurtította a biztonsági részleg bérét, majd eladta a flotta felét, Kormos kapitány – a volt biztonsági főnök – fellázadt. Elvitte a hajókat, és új zászló alatt, <b>Vörös Vitorla</b> néven kalózkodni kezdett. A hajótesteken még ott vannak a Meridián törzsfestésének csíkjai, a logókat letörölték.</p><p><b>A te szereped.</b> Te vagy az <b>ULTRA V26</b> ágyútornyosa. A Meridián megmaradt konvoját és az Élő Univerzum kutatóállomást bízták rád. A Vörös Vitorla hullámokban támad.</p><p><b>Forgatókönyv.</b><br>I. felvonás (1–4. hullám): felderítők és kísérőhajók tapogatóznak.<br>II. felvonás (5. hullám): megjelenik az <b>Aranyfosztó</b>, a Vörös Vitorla zászlóshajója, a Meridián egykori legnagyobb teherhordója.<br>III. felvonás (6–9. hullám): átalakított teherhajók, torpedók és kamikaze kapszulák.<br>IV. felvonás (10. hullám): Kormos kapitány személyesen indul a csatába.<br>Utána a kalózok újra és újra visszatérnek, egyre erősebben.</p>`,
`<p><b>Egér / érintés:</b> célzás. Az automata tűz alapból be van kapcsolva: gyors dupla vagy tripla sorozatokat lősz magától, csak a célra kell vinned az egeret. Kikapcsolva (T) lenyomva tartva lősz. A lézer soha nem fogy el.<br><b>Jobb gomb / R / 🚀:</b> rakéta (célkereső).<br><b>1 · 2 · 3 vagy Q / 🔫:</b> fegyverváltás: lézer, szóró, plazma.<br><b>B / ⚡:</b> EMP impulzus (ha feltöltődött).<br><b>X / Shift / ↻:</b> kitérés.<br><b>Szóköz:</b> lövés (ha az automata tűz ki van kapcsolva).<br><b>T:</b> automata tűz be/ki.<br><b>Esc / P / 🎮:</b> szünet és menü.<br><b>🔊 / HANG:</b> hang be-ki.<br><b>F:</b> teljes képernyő (PC-n F11 is jó).</p><p>Ha az egér az ellenség közelébe ér, a lövésed kicsit magától rá irányul (célzássegítség). Piros keret jelzi, ha célon vagy.</p>`,
`<p><b>Pajzs és hajótest.</b> A találatot először a pajzs nyeli el, ami 3 mp sérülés nélkül visszatöltődik. Ha elfogy, a hajótest sérül. Ha a hajótest 0, a játék véget ér.</p><p><b>Rakéta.</b> 6-tal indulsz, kb. 9 másodpercenként újratöltődik 1 (legfeljebb 8). Nagy területen sebez, a célt követi.</p><p><b>EMP.</b> Kilövésekkel töltődik (főellenség 40%). 100%-nál törli az ellenséges lövedékeket, és minden ellenséget sebez.</p><p><b>Kitérés.</b> 1 mp sérthetetlenség, 7 mp töltés.</p><p><b>Pontozás.</b> Vadász 100, Roham 150, Zsákmányoló 300, Kamikaze 180, aszteroida 30, főellenség 2000. Sorozat-szorzó: minden 4 gyors kilövés +0,5×, találat vagy 3,5 mp szünet nullázza.</p><p><b>Játékmódok.</b> Hullámharc: hullámok, 5. hullámonként főellenség. Túlélő: végtelen, egyre sűrűbb támadás. Főellenség-roham: minden hullám főellenség kísérettel.</p><p><b>Nehézség.</b> Könnyű: kevesebb sebzés, nagyobb célzássegítség. Nehéz: gyakoribb és erősebb ellenséges lövések, kisebb segítség.</p>`,
`<p><b>Sólyom-vadász.</b> Egykori Meridián kísérőhajók. Hatszögletű szárnyak, mérsékelt tűzerő. Kormos legénységének gerince.</p><p><b>Tőr-rohamos.</b> Átfestett futárhajók: gyorsak és könnyen törnek, de ritkán tévesztenek.</p><p><b>Zsákmányoló bombázó.</b> Átalakított teherhajó torpedóhordozóval. A torpedó lassú, de nagyot üt: lődd le vagy robbantsd fel!</p><p><b>Tűzgyújtó kapszula.</b> Robbanóanyaggal töltött rakománykapszulák (4. hullámtól). Egyenesen neked rohannak, lődd le őket, mielőtt eltalálnak.</p><p><b>Aszteroidák.</b> Az elhagyott bányászmezők maradékai. Lelőhetők, a pályán belül sebeznek.</p><p><b>Aranyfosztó (főellenség).</b> A Vörös Vitorla zászlóshajója, egykor a Meridián legnagyobb teherhordója. Sok életerő, sorozatban lő. Rakétával és plazmával a leghatékonyabb.</p><p><b>Kormos kapitány.</b> A kalózok vezére, volt biztonsági főnök. Az 10. hullámtól személyesen jelenik meg.</p>`,
